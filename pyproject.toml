[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "anomaly_detection"
version = "0.0.1"
description = "Proyecto de la materia vision por computadora aplicado. Integrantes: Jaber Olarte, Pablo Bertel y Eduardo Baez"
authors = [
  { name = "D. Science EAFIT CV" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["anomaly_detection"]
include = ["pyproject.toml", "anomaly_detection/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["anomaly_detection"]
force-sort-within-sections = true

